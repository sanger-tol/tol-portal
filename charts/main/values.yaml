# Default values for tol-portal-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

tolcore:
  app:
    name: tol-portal

  replicaCount: 1

  image:
    repository: ""
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "serviceaccount"

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  job:
    restartPolicy: "OnFailure"

  deployment:
    environment: "dev"
  db:
    enabled: true
    fullname: "tol-portal-db"
    user: ""
    password: ""
    name: ""
    host: ""
    port: "" # specify as a string
  schemaspy:
    enabled: true
    image:
      repository: ""
      tag: ""
  elastic:
    uri: ""
    user: ""
    password: ""
    index_prefix: ""
  api:
    enabled: true
    fullname: "tol-portal-api"
    probe_url: '/api/v1/system/healthz'
    path: '/api/v1'
    data_path: '/data'
    extra_env:
      API_PATH: api.path
      API_DATA_PATH: api.data_path
      ELASTIC_URI: elastic.uri
      ELASTIC_USER: elastic.user
      ELASTIC_PASSWORD: elastic.password
      ELASTIC_INDEX_PREFIX: elastic.index_prefix
      GOOGLE_CLIENT_SECRETS: google.client_secrets_json
      PREFECT_URL: prefect.url
      PREFECT_API_PATH: prefect.api_path
      UPLOAD_S3_BUCKET: s3.bucket
      S3_URI: s3.uri
      S3_ACCESS_KEY: s3.access_key
      S3_SECRET_KEY: s3.secret_key
      S3_SECURE: s3.secure
  flask:
    env: ""
  ui:
    fullname: "tol-portal-ui"
    probe_url: '/'
    matomo_site_id: ''
    extra_env:
      REACT_APP_API_PATH: api.path
      REACT_APP_API_DATA_PATH: api.data_path
      REACT_APP_MATOMO_SITE_ID: ui.matomo_site_id
  s3:
    uri: ""
    access_key: ""
    secret_key: ""
    bucket: ""
    secure: ""
  backup:
    schedule: ""
  restore:
    prefix: ""
  alembic:
    enabled: true
  google:
    client_secrets_json: ""
  prefect:
    url: https://prefect-staging.tol.sanger.ac.uk
    api_path: /api
  oidc:
    enabled: true
    url:
      auth: ""
      token: ""
      revoke: ""
      userinfo: ""
