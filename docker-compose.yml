# This is used for local development only

services:
  tol-portal-db:
    image: postgres:12
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - 5441:5432

  tol-portal-api:
    build:
      context: tol-portal-api/.
      dockerfile: Dockerfile.dev
    image: tol-portal-api
    environment:
      - REDIS_HOST
      - REDIS_PORT 
      - ELASTIC_URI
      - ELASTIC_USER
      - ELASTIC_PASSWORD
      - ELASTIC_INDEX_PREFIX
      - DB_URI
      - TOL_PORTAL_URL
      - API_PATH
      - API_DATA_PATH
      - GOOGLE_CLIENT_SECRETS
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_REDIRECT_URI
      - OIDC_AUTH_URL
      - OIDC_USER_INFO_URL
      - OIDC_TOKEN_URL
      - OIDC_REVOKE_TOKEN_URL
      - PREFECT_URL
      - PREFECT_API_PATH
      - UPLOAD_S3_BUCKET
      - S3_URI
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_SECURE
    ports:
      - 8088:80
    volumes:
      - './tol-portal-api/app/main:/app/main'
      - '../tol-sdk:/packages/tol-sdk:rw'
    restart: always
    depends_on:
      - tol-portal-redis

  tol-portal-ui:
    build:
      context: tol-portal-ui/.
      dockerfile: Dockerfile.dev
    image: tol-portal-ui
    stdin_open: true
    environment:
      - NODE_ENV=development
      - REACT_APP_API_PATH=${API_PATH}
      - REACT_APP_API_DATA_PATH=${API_DATA_PATH}
      - REACT_APP_MATOMO_SITE_ID=${MATOMO_SITE_ID}
      - LOCAL_TOLUI=${LOCAL_TOLUI}
      - REACT_APP_PORTAL_URL=${PORTAL_URL}
      - REACT_APP_PORTAL_API_PATH=${PORTAL_API_PATH}
      - REACT_APP_PORTAL_API_DATA_PATH=${PORTAL_API_DATA_PATH}
      - REACT_APP_PORTAL_DATASPACE=${PORTAL_DATASPACE}
    ports:
      - 3010:3000
    volumes:
      - './tol-portal-ui/app:/usr/src/app'
      - '/usr/src/app/node_modules'
      - '../components/components-ui/app/src/tol-ui:/usr/src/app/src/tol-ui'

  tol-portal-dbutils:
    image: gitlab-registry.internal.sanger.ac.uk/tol/tol-core/dbutils:1.0.4
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_PORT
      - BACKUP_S3_ACCESS_KEY
      - BACKUP_S3_SECRET_KEY
      - BACKUP_S3_URI
      - BACKUP_S3_BUCKET
      - BACKUP_S3_SECURE
      - RESTORE_FILE_PREFIX
      - FLASK_ENV
      - BACKUP_SCHEDULE
  
  tol-portal-alembic:
    image: tol-portal-api
    container_name: tol-portal-alembic
    restart: always
    environment:
      - DB_URI
    working_dir: /migrations
    volumes:
      - ./tol-portal-api/migrations/alembic/versions:/migrations/alembic/versions

  tol-portal-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tol-portal-python-db:
    image: elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
  
  tol-portal-python-unit-test:
    build:
      context: tol-portal-api
      dockerfile: Dockerfile.test
    command: pytest -v unit

  tol-portal-python-system-test:
    build:
      context: tol-portal-api
      dockerfile: Dockerfile.test
    command: pytest -v system
    depends_on:
      - tol-portal-python-db

  tol-portal-playwright-test:
    build: test/playwright
    volumes:
      - "./test/playwright:/usr/src/app:rw"
      - "/usr/src/app/node_modules"
    environment:
      - PLAYWRIGHT_URL=https://host.docker.internal:3010
      - DOCKER_COMPOSE=1

volumes:
  redis_data: